# The Rust w2m (docs/rust-port-plan-2026-10-21.md): one crate per layer as the port reaches it.
[workspace]
resolver = "3"
members = ["crates/a64_encoder", "crates/design_check", "crates/edit_guard", "crates/events", "crates/guest_runtime", "crates/hypervisor", "crates/cpu_cases", "crates/pe_image", "crates/pe_loader", "crates/session_events", "crates/translator", "crates/signal_report", "crates/vocabulary_generator", "crates/vocabulary_samples", "crates/w2m_vm", "crates/virtual_memory", "crates/x86_decoder"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

# BLACKBOARD Decision 2026-10-24 agent-resolved (serde_json: Value only, its source read)
[workspace.dependencies]
serde_json = "1.0.154"

[profile.release]
debug = 1
# a shift by the type's width or an arithmetic overflow panics in release too (Sprint 176; reviewer-2's Low 1 of
# 2026-10-28: Sprint 173's IDIV `1i128 << 128` wrapped in the release case runs)
overflow-checks = true
