# The case runner's verdicts on a substrate record (Sprint 150): one Rust Producer runs every downloaded Intel run of the
# CPU cases through w2m_vm's case runner and writes differential.py's sequence, a unit per instruction class. Run from
# the repository root after `cargo build --release`, on this Mac (Hypervisor.framework, build/probe-runs, the fixture):
#   uv run substrate run --file harness/case-runs.toml --root store/runs/case-runner-<ns> --strict

[baseline]
harness = "w2m"
vocabulary = "0.12"
# not `differential`: that key marks the causal records differential.py writes, which tests/test_differential.py holds
# to their chain; this record's events come from one Producer
judge = "case-runner"
implementation = "the Rust case runner on the frozen Python lowering's words"
reference = "the Intel runs of store/case_runner/expected.tsv"

[[producer]]
kind = "case_runs"
# hv_vm_create refuses an unsigned process: the binary is signed with the Hypervisor entitlement first
command = ["../scripts/sign_and_run.sh", "../target/release/case_runs"]
schemas = "schemas/harness-events.json"

[[initial]]
kind = "case_runs"

[termination]
recipe = "all_completed"
