# The case runner's verdicts with the Rust translator (Sprint 151): from Sprint 238 the Rust translator compiles every
# case, and Sprint 150's harness, the frozen Python lowering's words, is retired with them. Run from the repository root
# on this Mac (Hypervisor.framework, build/probe-runs):
#   uv run substrate run --file harness/case-runs-rust.toml --root store/runs/case-runner-rust-<ns> --strict
# <ns> is the run's start in nanoseconds; the four profiles, started together, take one start and 30 ms steps after it
# (Sprint 187; reviewer-2's Low 3 of its review of 182-184). The producer is built by cargo from the current sources,
# signed by the runner (.cargo/config.toml), and refuses to run when the work tree's crates/ is not the one it was built
# from (`w2m_vm::built_from`; Sprint 187, reviewer-2's Medium 3: a relinked planted binary wrote Sprint 183's first four
# records).

[baseline]
harness = "w2m"
vocabulary = "0.12"
# not `differential`: that key marks the causal records differential.py writes, which tests/test_differential.py holds
# to their chain; this record's events come from one Producer
judge = "case-runner-rust"
implementation = "the Rust translator (crates/translator), run by the Rust case runner"
reference = "the Intel runs of store/case_runner/expected.tsv"

[[producer]]
kind = "case_runs"
# hv_vm_create refuses an unsigned process: cargo's runner signs the binary with the Hypervisor entitlement before it
# runs (Sprint 187: built by cargo, never a prebuilt binary)
command = ["cargo", "run", "--release", "--quiet", "--bin", "case_runs"]
schemas = "schemas/harness-events.json"

[[initial]]
kind = "case_runs"

[termination]
recipe = "all_completed"
