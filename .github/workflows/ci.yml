# Every gate in WORKING_AGREEMENT.md on each push (Sprint 027; review 2026-10-08 §5): no project Python runs
# (BLACKBOARD Decision 2026-10-29, "No Python runs"); substrate, the harness, runs under `uv`, as the Decision allows. The references the Rust tests read are present
# (llvm-objdump, the Python 3.14.8 distribution's Windows binaries as a PE corpus at its manifest hash); the 8 case
# sets that were built here with Python are not, and the tests that read them skip, the local gates requiring them.
name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # the whole history: `signal_report --check` compares a closed sprint's gates trees with its work commit's
          # (Sprint 187)
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: llvm-objdump
        run: |
          sudo apt-get install -y --no-install-recommends llvm
          llvm-objdump --version | head -2
      - name: corpus (corpus/python-3.14.8.manifest.json)
        run: |
          url=$(jq -r .source corpus/python-3.14.8.manifest.json)
          want=$(jq -r .zip_sha256 corpus/python-3.14.8.manifest.json)
          curl -sSfL -o /tmp/corpus.zip "$url"
          echo "$want  /tmp/corpus.zip" | sha256sum -c -
          mkdir -p corpus/python-3.14.8 && unzip -q /tmp/corpus.zip -d corpus/python-3.14.8
      - name: substrate (substrate.commit; the local clone ./substrate on branch w2m, user 2026-10-10)
        run: |
          git clone --quiet --filter=blob:none https://github.com/laffeyp/substrate.git substrate
          git -C substrate checkout --quiet "$(cat substrate.commit)"
          git -C substrate log --oneline -1
      - name: sync
        run: uv sync --all-extras
      - name: case files (the 8 sets once built here with Python, from their releases, Sprint 225)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r dir run tag; do
            gh release download "$tag" --pattern "$run-cases.bin" --output "probes/$dir/cases.bin" --clobber
            echo "$(cut -c1-64 "store/probe-runs/$run/cases.sha256")  probes/$dir/cases.bin" | sha256sum -c -
          done <<'EOF'
          semantics 38011862284 semantics-039
          semantics_041 38029980267 semantics-041
          semantics_049 38117654018 semantics-049
          semantics_049b 38118493713 semantics-049b
          semantics_050 38122967607 semantics-050
          semantics_065 38222873837 semantics-065
          semantics_065b 38234338405 semantics-065b
          semantics_065c 38238041162 semantics-065c
          EOF
          test "$(ls probes/semantics*/cases.bin | wc -l)" -eq 21
      - name: rust (rust-toolchain.toml pins 1.99.1; rustup on the runner installs it)
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings -D clippy::collection_is_never_read  # a gathered list never read (Sprint 235)
          cargo test --quiet
          cargo build --release --quiet
          target/release/vocabulary_generator --check
          target/release/signal_report --check
          target/release/design_check
      - name: session check (a Rust binary's events on a substrate record, Sprint 125)
        run: |
          uv run substrate run --file harness/session-check.toml --root "$RUNNER_TEMP/session-check" --strict
          uv run substrate replay "$RUNNER_TEMP/session-check" --level 2
      - name: vocabulary samples (every harness-plane tag through its Rust type and substrate's schema, Sprint 126)
        run: |
          uv run substrate run --file harness/vocabulary-samples.toml --root "$RUNNER_TEMP/vocabulary-samples" --strict
          uv run substrate replay "$RUNNER_TEMP/vocabulary-samples" --level 2
          if uv run substrate run --file harness/vocabulary-samples-planted.toml --root "$RUNNER_TEMP/planted" --strict; then echo "planted sample accepted"; exit 1; fi
          uv run substrate tail "$RUNNER_TEMP/planted" --format jsonl --no-follow | grep -q vocab_version
