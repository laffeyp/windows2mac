# Tiebreak probe runner (Sprints 006-007). Builds probes/<probe>/<probe>.c with clang on real x64
# Windows, runs it `repeat` times, and uploads the guest traces and role maps for ingest on the Mac.
# Dispatch: gh workflow run windows-probe.yml -f probe=<dir> -f execution_id=<id> [-f repeat=N]
# Probe CLI: <probe>.exe <execution_id> <trace_path> <roles_path>; mode stdout: no arguments;
# mode file: <probe>.exe probes/<probe>/cases.bin out/result-<i>.bin
name: windows-probe

on:
  workflow_dispatch:
    inputs:
      probe:
        description: probe directory under probes/
        required: true
      execution_id:
        description: execution_id prefix written into each trace (suffixed -1, -2, ...)
        required: true
      repeat:
        description: number of executions
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: build
        shell: pwsh
        run: |
          clang --version
          # probes/<probe>/probe.json may set cflags, libs, and mode (Sprint 029: no-CRT probes)
          $cfg = "probes/${{ inputs.probe }}/probe.json"
          $flags = @("-O1", "-Wall", "-Werror"); $libs = @("-ladvapi32", "-lbcrypt")
          if (Test-Path $cfg) { $c = Get-Content $cfg -Raw | ConvertFrom-Json; $flags = $c.cflags -split " "; $libs = $c.libs -split " " }
          clang @flags -o probe.exe "probes/${{ inputs.probe }}/${{ inputs.probe }}.c" @libs
      - name: run
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          (Get-FileHash -Algorithm SHA256 probe.exe).Hash.ToLower() | Out-File -Encoding ascii -NoNewline out/probe.sha256
          Copy-Item probe.exe out/probe.exe
          $mode = "args"
          $cfg = "probes/${{ inputs.probe }}/probe.json"
          if (Test-Path $cfg) { $mode = (Get-Content $cfg -Raw | ConvertFrom-Json).mode }
          $cv = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion"
          $v = [Environment]::OSVersion.Version
          "gha-windows-2025-x64-$($v.Major).$($v.Minor).$($v.Build).$($cv.UBR)-$($cv.InstallationType)" | Out-File -Encoding ascii -NoNewline out/profile.txt
          (Get-CimInstance Win32_Processor | Select-Object -First 1).Name | Out-File -Encoding ascii -NoNewline out/cpu.txt
          for ($i = 1; $i -le [int]"${{ inputs.repeat }}"; $i++) {
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            if ($mode -eq "file") {
              # mode file (Sprint 037): probes/<probe>/cases.bin in, a result file out
              ./probe.exe "probes/${{ inputs.probe }}/cases.bin" "out/result-$i.bin"
            } elseif ($mode -eq "stdout") {
              # mode stdout: the probe writes its own trace body; cmd keeps the bytes unchanged
              cmd /c "probe.exe > out\body-$i.jsonl"
            } else {
              ./probe.exe "${{ inputs.execution_id }}-$i" "out/trace-$i.jsonl" "out/roles-$i.json"
            }
            $code = $LASTEXITCODE
            $sw.Stop()
            # observed per execution (vocabulary 0.4, P13): exit code and wall time of the process
            "{`"exit_code`": $code, `"elapsed_seconds`": $($sw.Elapsed.TotalSeconds)}" | Out-File -Encoding ascii -NoNewline "out/exec-$i.json"
            if ($code -ne 0) { exit $code }
          }
          Get-ChildItem out | Get-FileHash -Algorithm SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()                         # a failing probe's output is the evidence (Sprint 034)
        with:
          name: traces-${{ inputs.execution_id }}
          path: out/
          if-no-files-found: error
