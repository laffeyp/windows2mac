# Game runner (Sprint 033). Unpacks a game from its private release, checks every file against
# games/<game>/files.json, starts it through tools/jit_capture (Mono JIT-done hook) in Unity batch
# mode, and uploads the capture and the Unity log for the decoder differential on the Mac.
# Dispatch: gh workflow run windows-game.yml -f game=hail-to-the-rainbow -f exe="Hail to the Rainbow" [-f seconds=N] [-f mode=batch|play]
# The launcher also writes <capture>.imports.tsv (calls per imported function of UnityPlayer and Mono),
# .dynamic.tsv (names resolved with GetProcAddress) and .threads.txt (peak and distinct threads) (Sprint 038).
name: windows-game

on:
  workflow_dispatch:
    inputs:
      game:
        description: directory under games/
        required: true
      exe:
        description: game executable name without .exe (Unity finds <exe>_Data by it)
        required: true
      seconds:
        description: how long the game runs before it is stopped
        required: false
        default: "180"
      mode:
        description: "batch (-batchmode -nographics) or play (a window, the software renderer, keys sent every 3 s)"
        required: false
        default: "batch"

permissions:
  contents: read

jobs:
  game:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: build launcher
        shell: pwsh
        run: |
          clang --version
          # the game's own manifest (games/<game>/manifest.xml, its RT_MANIFEST; Sprint 054): Windows answers the
          # version, DPI and common-controls questions by the manifest of the exe the process runs
          $m = @()
          if (Test-Path "games/${{ inputs.game }}/manifest.xml") {
            "1 24 `"games/${{ inputs.game }}/manifest.xml`"" | Out-File -Encoding ascii manifest.rc
            llvm-rc /nologo /I . /fo manifest.res manifest.rc
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $m = @("manifest.res", "-Wl,/manifest:no")
          }
          clang -O1 -Wall -Werror -o jit_capture.exe tools/jit_capture/jit_capture.c "-Wl,/subsystem:windows" @m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # the crash handler's tracer (Sprint 055): jit_capture queues it into UnityCrashHandler64.exe at its start
          clang -O1 -Wall -Werror -shared -o handler_trace.dll tools/jit_capture/handler_trace.c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # the game exe's resources into the launcher at install (Sprint 061)
          clang -O1 -Wall -Werror -o copy_resources.exe tools/jit_capture/copy_resources.c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: disk
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
      - name: fetch and unpack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="games/${{ inputs.game }}"
          # jq, sha256sum and df, no Python (BLACKBOARD Decision 2026-10-29, "No Python runs"; Sprint 227): the runner
          # images list jq 1.8.2 and zstd 1.5.7 (actions/runner-images, Windows2025-Readme.md)
          tag=$(jq -r .tag "$meta/release.json")
          base=/c/w2m; [ -d /d ] && base=/d/w2m                      # the drive with room, when present
          # GitHub documents 14 GB for this runner; run 37979176570 measured 118 GB free on D:.
          # Parts and the unpacked tree need about 24 GB at the peak: stop early if that is gone.
          need=$((26 * 1024 * 1024 * 1024))
          free=$(df -B1 --output=avail "${base%/w2m}/" | tail -1 | tr -d ' ')
          echo "free on ${base%/w2m}: $free bytes; need $need"
          [ "$free" -ge "$need" ] || { echo "not enough disk"; exit 1; }
          mkdir -p $base/parts $base/game
          echo "GAME_DIR=$(cygpath -w $base/game)" >> "$GITHUB_ENV"
          # only the parts release.json names: the release also holds other assets (Sprint 033's capture)
          for part in $(jq -r '.parts[].name' "$meta/release.json"); do
            gh release download "$tag" --repo "${{ github.repository }}" --dir $base/parts --pattern "$part"
          done
          # each part's sha256 against release.json
          jq -r '.parts[] | "\(.sha256)  \(.name)"' "$meta/release.json" | (cd $base/parts && sha256sum -c --quiet -)
          echo "parts verified"
          zstd --version || choco install zstandard -y --no-progress
          for part in $(jq -r '.parts[].name' "$meta/release.json"); do
            cat "$base/parts/$part"; rm "$base/parts/$part"
          done | zstd -d -c | tar -xf - -C $base/game
          # each file's sha256 against files.json, and no file present that it does not list
          jq -r '.listing[] | "\(.sha256)  \(.path)"' "$meta/files.json" > "$RUNNER_TEMP/files.sha256"
          (cd $base/game && sha256sum -c --quiet "$RUNNER_TEMP/files.sha256")
          jq -r '.listing[].path' "$meta/files.json" | sort > "$RUNNER_TEMP/listed"
          (cd $base/game && find . -type f | sed 's|^\./||' | sort) > "$RUNNER_TEMP/present"
          extra=$(comm -13 "$RUNNER_TEMP/listed" "$RUNNER_TEMP/present" | head -5)
          [ -z "$extra" ] || { echo "unlisted: $extra"; exit 1; }
          echo "$(wc -l < "$RUNNER_TEMP/listed") files verified against files.json; no other file present"
      - name: install launcher
        shell: pwsh
        run: |
          Move-Item "$env:GAME_DIR\${{ inputs.exe }}.exe" "$env:GAME_DIR\${{ inputs.exe }}.original.exe"
          Copy-Item jit_capture.exe "$env:GAME_DIR\${{ inputs.exe }}.exe"
          # the process's own module answers with the game's resources (its icon: LoadIconA(module, 103))
          .\copy_resources.exe "$env:GAME_DIR\${{ inputs.exe }}.original.exe" "$env:GAME_DIR\${{ inputs.exe }}.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item handler_trace.dll "$env:GAME_DIR\handler_trace.dll"
          # The game runs from C:\w2m\app, a junction to the unpacked tree, with TMP and TEMP at
          # C:\Users\w2m\AppData\Local\Temp and its log at C:\w2m\unity.log: the paths w2m gives it
          # (vm_backend APP_PATH, USER_ENVIRONMENT; run_frontier BATCH_ARGUMENTS), so a value derived from a path
          # has the same length on both (Sprint 060: the game at D:\w2m\game made each such value one longer).
          New-Item -ItemType Directory -Force C:\w2m | Out-Null
          if (Test-Path C:\w2m\app) { cmd /c rmdir C:\w2m\app }
          New-Item -ItemType Junction -Path C:\w2m\app -Target "$env:GAME_DIR" | Out-Null
          New-Item -ItemType Directory -Force C:\Users\w2m\AppData\Local\Temp | Out-Null
          "APP_DIR=C:\w2m\app" | Out-File -Encoding ascii -Append $env:GITHUB_ENV
      - name: run
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $cv = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion"
          $v = [Environment]::OSVersion.Version
          "gha-windows-2025-x64-$($v.Major).$($v.Minor).$($v.Build).$($cv.UBR)-$($cv.InstallationType)" | Out-File -Encoding ascii -NoNewline out/profile.txt
          (Get-CimInstance Win32_Processor | Select-Object -First 1).Name | Out-File -Encoding ascii -NoNewline out/cpu.txt
          $env:W2M_JIT_CAPTURE = "$PWD\out\jit_capture.bin"
          $env:TMP = "C:\Users\w2m\AppData\Local\Temp"
          $env:TEMP = "C:\Users\w2m\AppData\Local\Temp"
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          if ("${{ inputs.mode }}" -eq "play") {
            # a window on the runner's display; Unity picks its device (no GPU: Microsoft's software renderer
            # if Unity accepts it); Enter and Space every 3 s to pass the intro and the main menu
            $gameArgs = @("-screen-fullscreen", "0", "-screen-width", "1280", "-screen-height", "720", "-logFile", "`"C:\w2m\unity.log`"")
          } else {
            $gameArgs = @("-batchmode", "-nographics", "-logFile", "`"C:\w2m\unity.log`"")
          }
          $p = Start-Process -FilePath "$env:APP_DIR\${{ inputs.exe }}.exe" -WorkingDirectory "$env:APP_DIR" `
               -ArgumentList $gameArgs -PassThru
          $deadline = (Get-Date).AddSeconds([int]"${{ inputs.seconds }}")
          $shell = New-Object -ComObject WScript.Shell
          $done = $false
          while ((Get-Date) -lt $deadline -and -not $done) {
            $done = $p.WaitForExit(3000)
            if (-not $done -and "${{ inputs.mode }}" -eq "play") {
              [void]$shell.AppActivate($p.Id); $shell.SendKeys("{ENTER}"); $shell.SendKeys(" ")
            }
          }
          $sw.Stop()
          # Stop-Process returns before the process is gone; the capture and log stay open until it is,
          # and the game's own children (UnityCrashHandler64) hold handles too (run 38006671518 failed
          # hashing a file still in use). Stop everything started from the game folder and wait for it.
          if (-not $done) { Stop-Process -Id $p.Id -Force; [void]$p.WaitForExit(30000); $code = $null } else { $code = $p.ExitCode }
          Get-Process | Where-Object { $_.Path -and ($_.Path.StartsWith($env:GAME_DIR) -or $_.Path.StartsWith($env:APP_DIR)) } | ForEach-Object {
            Stop-Process -Id $_.Id -Force; [void]$_.WaitForExit(30000)
          }
          if (Test-Path C:\w2m\unity.log) { Copy-Item C:\w2m\unity.log out\unity.log }
          $exit = if ($null -eq $code) { "null" } else { "$code" }
          "{`"exited_by_itself`": $($done.ToString().ToLower()), `"exit_code`": $exit, `"elapsed_seconds`": $($sw.Elapsed.TotalSeconds)}" | Out-File -Encoding ascii -NoNewline out/exec.json
          Get-Content out/exec.json
          Get-ChildItem out | Format-Table Name, Length
          Get-ChildItem out | Get-FileHash -Algorithm SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: game-${{ inputs.game }}-${{ github.run_id }}
          path: out/
          if-no-files-found: error
